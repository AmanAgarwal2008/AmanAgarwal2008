<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Engineering focus telemetry</title><desc id="d">Animated qualitative indicators of current engineering focus areas, not fabricated activity statistics.</desc>
<style>
:root{--paper:#f7f5ef;--ink:#20251f;--muted:#667067;--rule:#c9cec5;--accent:#47745b;--accent2:#b47b42;--panel:#eeece4;--ghost:#dfe4dc}
@media(prefers-color-scheme:dark){:root{--paper:#101612;--ink:#edf1e9;--muted:#a3afa5;--rule:#3b4940;--accent:#b7e4c7;--accent2:#e5b879;--panel:#19231d;--ghost:#26332b}}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.serif{font-family:Georgia,'Times New Roman',serif}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .85s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.pop{opacity:0;animation:pop .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.type{animation:type 3.8s steps(48,end) .9s both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.cursor{animation:blink .85s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.a1{animation-delay:.15s}.a2{animation-delay:.4s}.a3{animation-delay:.7s}.a4{animation-delay:1s}.a5{animation-delay:1.3s}.a6{animation-delay:1.6s}
@media(prefers-reduced-motion:reduce){.draw,.rise,.fade,.pop,.flow,.pulse,.type,.cursor{animation:none!important}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.cursor{visibility:visible}}
</style>
<rect width="100%" height="100%" rx="12" fill="var(--paper)"/>

<text class="mono" x="34" y="34" fill="var(--muted)" font-size="11" letter-spacing="3">BUILD TELEMETRY / CURRENT AREAS OF EXPLORATION</text>
<g class="pop a1"><text class="mono" x="36" y="90" fill="var(--ink)" font-size="13" letter-spacing="1">AI ENGINEERING</text><text class="mono" x="1160" y="90" fill="var(--muted)" font-size="11" text-anchor="end">local models · prompt systems · inference</text><rect x="36" y="107" width="1124" height="8" rx="4" fill="var(--ghost)"/><rect class="pulse" x="36" y="107" width="989.1" height="8" rx="4" fill="var(--accent)"/></g><g class="pop a2"><text class="mono" x="36" y="162" fill="var(--ink)" font-size="13" letter-spacing="1">PRODUCT ENGINEERING</text><text class="mono" x="1160" y="162" fill="var(--muted)" font-size="11" text-anchor="end">web apps · mobile apps · user workflows</text><rect x="36" y="179" width="1124" height="8" rx="4" fill="var(--ghost)"/><rect class="pulse" x="36" y="179" width="854.2" height="8" rx="4" fill="var(--accent)"/></g><g class="pop a3"><text class="mono" x="36" y="234" fill="var(--ink)" font-size="13" letter-spacing="1">BACKEND SYSTEMS</text><text class="mono" x="1160" y="234" fill="var(--muted)" font-size="11" text-anchor="end">data models · auth · APIs · integrations</text><rect x="36" y="251" width="1124" height="8" rx="4" fill="var(--ghost)"/><rect class="pulse" x="36" y="251" width="809.3" height="8" rx="4" fill="var(--accent)"/></g><g class="pop a4"><text class="mono" x="36" y="306" fill="var(--ink)" font-size="13" letter-spacing="1">OPEN SOURCE</text><text class="mono" x="1160" y="306" fill="var(--muted)" font-size="11" text-anchor="end">learning in public · tooling · collaboration</text><rect x="36" y="323" width="1124" height="8" rx="4" fill="var(--ghost)"/><rect class="pulse" x="36" y="323" width="685.6" height="8" rx="4" fill="var(--accent)"/></g><text class="mono" x="1160" y="378" fill="var(--muted)" font-size="10" text-anchor="end">QUALITATIVE FOCUS AREAS — NOT ACTIVITY COUNTS</text>
</svg>