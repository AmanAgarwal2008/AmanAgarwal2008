<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Selected projects by Aman Agarwal</title><desc id="d">Four animated project panels for NEET CBT Masters, MyGPM Student Portal, AutoUPITracker and AI LLM experiments.</desc>
<style>
:root{--paper:#f7f5ef;--ink:#20251f;--muted:#667067;--rule:#c9cec5;--accent:#47745b;--accent2:#b47b42;--panel:#eeece4;--ghost:#dfe4dc}
@media(prefers-color-scheme:dark){:root{--paper:#101612;--ink:#edf1e9;--muted:#a3afa5;--rule:#3b4940;--accent:#b7e4c7;--accent2:#e5b879;--panel:#19231d;--ghost:#26332b}}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.serif{font-family:Georgia,'Times New Roman',serif}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .85s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.pop{opacity:0;animation:pop .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.type{animation:type 3.8s steps(48,end) .9s both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.cursor{animation:blink .85s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.a1{animation-delay:.15s}.a2{animation-delay:.4s}.a3{animation-delay:.7s}.a4{animation-delay:1s}.a5{animation-delay:1.3s}.a6{animation-delay:1.6s}
@media(prefers-reduced-motion:reduce){.draw,.rise,.fade,.pop,.flow,.pulse,.type,.cursor{animation:none!important}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.cursor{visibility:visible}}
</style>
<rect width="100%" height="100%" rx="12" fill="var(--paper)"/>

<g class="pop a1"><rect x="25" y="22" width="555" height="180" rx="5" fill="var(--panel)" stroke="var(--rule)"/><text class="mono" x="52" y="57" fill="var(--accent)" font-size="11" letter-spacing="2">01 / EDTECH · PRODUCT</text><text class="serif" x="52" y="101" fill="var(--ink)" font-size="31">NEET CBT MASTERS</text><text class="mono" x="52" y="132" fill="var(--muted)" font-size="13">AI-assisted question generation · CBT mock tests</text><text class="mono" x="52" y="160" fill="var(--muted)" font-size="11">React · Supabase · question workflows</text><path class="draw a3" d="M500 58V164M480 76H520M480 100H520M480 124H520M480 148H520" stroke="var(--accent)" stroke-width="2"/></g>
<g class="pop a2"><rect x="620" y="22" width="555" height="180" rx="5" fill="var(--panel)" stroke="var(--rule)"/><text class="mono" x="647" y="57" fill="var(--accent)" font-size="11" letter-spacing="2">02 / STUDENT PLATFORM · COLLABORATION</text><text class="serif" x="647" y="101" fill="var(--ink)" font-size="31">MyGPM Student Portal</text><text class="mono" x="647" y="132" fill="var(--muted)" font-size="13">Student, CR and admin workflows</text><text class="mono" x="647" y="160" fill="var(--muted)" font-size="11">Supabase · backend architecture · monorepo</text><circle cx="1100" cy="112" r="29" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="1100" cy="112" r="17" fill="none" stroke="var(--accent2)" stroke-width="1.5"/></g>
<g class="pop a3"><rect x="25" y="225" width="555" height="180" rx="5" fill="var(--panel)" stroke="var(--rule)"/><text class="mono" x="52" y="260" fill="var(--accent)" font-size="11" letter-spacing="2">03 / ANDROID · PERSONAL FINANCE</text><text class="serif" x="52" y="304" fill="var(--ink)" font-size="31">AutoUPITracker</text><text class="mono" x="52" y="335" fill="var(--muted)" font-size="13">Automated transaction capture &amp; categorisation</text><text class="mono" x="52" y="363" fill="var(--muted)" font-size="11">Kotlin · Jetpack Compose · local storage · OCR</text><path d="M493 260H535V365H493Z" fill="none" stroke="var(--accent)" stroke-width="1.5"/><path d="M503 280H525M503 296H525M503 312H525" stroke="var(--accent2)" stroke-width="2"/></g>
<g class="pop a4"><rect x="620" y="225" width="555" height="180" rx="5" fill="var(--panel)" stroke="var(--rule)"/><text class="mono" x="647" y="260" fill="var(--accent)" font-size="11" letter-spacing="2">04 / RESEARCH &amp; EXPERIMENTS</text><text class="serif" x="647" y="304" fill="var(--ink)" font-size="31">AI / LLM Lab</text><text class="mono" x="647" y="335" fill="var(--muted)" font-size="13">Local models · inference · coding agents</text><text class="mono" x="647" y="363" fill="var(--muted)" font-size="11">Ollama · Qwen · quantisation · tooling</text><circle class="pulse" cx="1100" cy="315" r="26" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="1100" cy="315" r="7" fill="var(--accent2)"/></g>

</svg>