<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Aman Agarwal — Software Engineering & Creative Technology</title><desc id="d">Animated editorial portfolio header with animated text reveal and line drawing.</desc>
<style>
:root{--paper:#f7f5ef;--ink:#20251f;--muted:#667067;--rule:#c9cec5;--accent:#47745b;--accent2:#b47b42;--panel:#eeece4;--ghost:#dfe4dc}
@media(prefers-color-scheme:dark){:root{--paper:#101612;--ink:#edf1e9;--muted:#a3afa5;--rule:#3b4940;--accent:#b7e4c7;--accent2:#e5b879;--panel:#19231d;--ghost:#26332b}}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.serif{font-family:Georgia,'Times New Roman',serif}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .85s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.pop{opacity:0;animation:pop .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.type{animation:type 3.8s steps(48,end) .9s both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.cursor{animation:blink .85s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.a1{animation-delay:.15s}.a2{animation-delay:.4s}.a3{animation-delay:.7s}.a4{animation-delay:1s}.a5{animation-delay:1.3s}.a6{animation-delay:1.6s}
@media(prefers-reduced-motion:reduce){.draw,.rise,.fade,.pop,.flow,.pulse,.type,.cursor{animation:none!important}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.cursor{visibility:visible}}
</style>
<rect width="100%" height="100%" rx="12" fill="var(--paper)"/>

<defs>
 <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--accent)" stop-opacity=".13"/><stop offset="1" stop-color="var(--accent2)" stop-opacity=".08"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="var(--rule)" stroke-opacity=".35"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="398" rx="12" fill="url(#wash)"/>
<rect x="1" y="1" width="1198" height="398" rx="12" fill="url(#grid)" opacity=".55"/>
<circle cx="1040" cy="180" r="150" fill="none" stroke="var(--accent)" stroke-opacity=".2"/>
<circle cx="1040" cy="180" r="112" fill="none" stroke="var(--accent2)" stroke-opacity=".35"/>
<path class="draw a2" d="M840 300L1040 100L1170 230" fill="none" stroke="var(--accent)" stroke-width="2"/>
<path class="draw a3" d="M920 45L1125 250M900 260L1100 60" fill="none" stroke="var(--rule)" stroke-width="1"/>
<line class="draw a1" x1="64" y1="58" x2="1136" y2="58" stroke="var(--rule)"/>
<g class="fade a1"><text class="mono" x="66" y="42" fill="var(--muted)" font-size="12" letter-spacing="3">PORTFOLIO / INDEX Nº 001</text><text class="mono" x="1135" y="42" fill="var(--muted)" font-size="12" letter-spacing="3" text-anchor="end">INDIA · OPEN TO BUILDING</text></g>
<g class="rise a2"><text class="serif" x="62" y="164" fill="var(--ink)" font-size="82" font-weight="bold" letter-spacing="-2">Aman Agarwal</text></g>
<g class="fade a3"><text class="mono" x="68" y="207" fill="var(--muted)" font-size="18" letter-spacing="1">SOFTWARE ENGINEERING &amp; CREATIVE TECHNOLOGY</text></g>
<g class="fade a4">
 <text class="mono" x="68" y="267" fill="var(--accent)" font-size="13" letter-spacing="2">CURRENT INTERESTS /</text>
 <text class="mono type" x="68" y="300" fill="var(--ink)" font-size="20">AI engineering · full-stack systems · Android · backend</text>
 <rect class="cursor a4" x="685" y="282" width="3" height="22" fill="var(--accent2)"/>
</g>
<g class="fade a5"><text class="mono" x="68" y="354" fill="var(--muted)" font-size="14">Building useful products at the intersection of software, systems and imagination.</text></g>
<line class="draw a6" x1="68" y1="375" x2="1136" y2="375" stroke="var(--rule)"/>
<text class="mono" x="68" y="392" fill="var(--muted)" font-size="10" letter-spacing="2">AI / PRODUCT ENGINEERING / OPEN SOURCE</text>
<text class="mono" x="1135" y="392" fill="var(--accent)" font-size="10" letter-spacing="2" text-anchor="end">AA — 001</text>

</svg>